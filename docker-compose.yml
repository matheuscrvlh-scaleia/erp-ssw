# ERP SSW: api, web, redis, postgres e backup. Variáveis em .env na raiz (fora do git; modelo em
# .env.example).
#
#   docker compose up -d --build                 # produção
#   docker compose up -d redis postgres          # desenvolvimento (bun run dev em apps/api e apps/web)
#
# Cada app é um projeto independente (package.json, bun.lock e Dockerfile próprios) e a imagem
# dele é construída só com a pasta dele.
#
# Portas no host: api 3001 (→ 3000), web 8081 (→ 80), postgres e redis só em 127.0.0.1. O web
# repassa /api para a api e /api/public/* para o worker-ssw, então o sistema inteiro responde na
# 8081. O worker-ssw (outro compose, mesma VPS) chega ao banco pela rede `erp_banco`.

name: erp

services:
  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORTA: "3000"
      # Proxies na frente da api: o web (Caddy) e, se houver, o nginx do host (então 2). O IP do
      # cliente sai do X-Forwarded-For.
      PROXIES_CONFIAVEIS: ${PROXIES_CONFIAVEIS:-1}
      REDIS_URL: redis://redis:6379/0
      # Obrigatórias (a api recusa no boot e diz qual falta). Domínio, e-mail (Resend) e
      # worker-ssw ficam na tela Plataforma › Integrações, não aqui.
      DATABASE_URL: ${DATABASE_URL:-}
      JWT_CHAVE_PRIVADA: ${JWT_CHAVE_PRIVADA:-}
      SEGREDOS_CHAVES: ${SEGREDOS_CHAVES:-}
      DB_MAX_CONEXOES: ${API_DB_MAX_CONEXOES:-10}
      LOG_NIVEL: ${LOG_NIVEL:-info}
      JOBS_LIGADOS: ${JOBS_LIGADOS:-true}
      AGENDAMENTOS_LIGADOS: ${AGENDAMENTOS_LIGADOS:-false}
      # Opcionais: só entram se estiverem no .env (ausente ≠ vazio).
      JWT_CHAVES_ANTERIORES:
      SEGREDOS_CHAVE_ATUAL:
      LOGO_URL_BASE:
      METRICAS_TOKEN:
    ports:
      - "${API_PORTA_HOST:-3001}:3000"
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    ports:
      - "${WEB_PORTA_HOST:-8081}:80"
    depends_on: [api]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    # Só no localhost do host: o bun run dev da api usa redis://127.0.0.1:6379.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_dados:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Banco do ERP (schema erp). Na 1ª subida, com o volume vazio, cria os papéis erp_migracao,
  # erp_app e erp_worker com as senhas do .env (apps/api/bootstrap). Depois disso as senhas do .env
  # não mudam mais nada: trocar senha é ALTER ROLE (docs/deploy.md §4).
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SENHA:?defina POSTGRES_SENHA no .env}
      ERP_MIGRACAO_SENHA: ${ERP_MIGRACAO_SENHA:?defina ERP_MIGRACAO_SENHA no .env}
      ERP_APP_SENHA: ${ERP_APP_SENHA:?defina ERP_APP_SENHA no .env}
      ERP_WORKER_SENHA: ${ERP_WORKER_SENHA:?defina ERP_WORKER_SENHA no .env}
    # Só no localhost do host: bun run dev, db:migrar e túnel SSH. Nunca aberto para a internet.
    ports:
      - "127.0.0.1:${POSTGRES_PORTA_HOST:-5432}:5432"
    volumes:
      - postgres_dados:/var/lib/postgresql/data
      - ./apps/api/bootstrap:/bootstrap:ro
      - ./apps/api/bootstrap/docker-roles.sh:/docker-entrypoint-initdb.d/docker-roles.sh:ro
    networks: [default, banco]
    shm_size: 256mb
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Dump diário do banco inteiro em BACKUP_PASTA (padrão ./backups), guardando BACKUP_DIAS dias.
  # Fica na mesma VPS: copiar para fora dela (docs/deploy.md §4).
  backup:
    image: postgres:17.11-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_SENHA:?defina POSTGRES_SENHA no .env}
      BACKUP_DIAS: ${BACKUP_DIAS:-7}
    volumes:
      - ./scripts/backup-postgres.sh:/backup.sh:ro
      - ${BACKUP_PASTA:-./backups}:/backups
    depends_on:
      postgres: { condition: service_healthy }

networks:
  # Rede com nome fixo para o compose do worker-ssw entrar (external).
  banco:
    name: erp_banco

volumes:
  redis_dados: {}
  postgres_dados: {}
