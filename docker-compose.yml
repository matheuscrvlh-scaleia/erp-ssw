# ERP SSW: api, web e redis. Variáveis em .env na raiz (fora do git; modelo em .env.example).
#
#   docker network create erp-interna      # uma vez; o worker-ssw entra nela também
#   docker compose up -d --build           # produção
#   docker compose up -d redis             # desenvolvimento: só o Redis (api e web com bun run dev)
#
# Portas no host: api 3001 (→ 3000), web 8081 (→ 80). O web repassa /api para a api e
# /api/public/* para o worker-ssw, então o sistema inteiro responde na 8081.

name: erp

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORTA: "3000"
      # O web (Caddy) fica na frente: o IP do cliente sai do X-Forwarded-For.
      PROXIES_CONFIAVEIS: "1"
      REDIS_URL: redis://redis:6379/0
      # Obrigatórias (a api recusa no boot e diz qual falta). Domínio, e-mail (Resend) e
      # worker-ssw ficam na tela Plataforma › Integrações, não aqui.
      DATABASE_URL: ${DATABASE_URL:-}
      JWT_CHAVE_PRIVADA: ${JWT_CHAVE_PRIVADA:-}
      SEGREDOS_CHAVES: ${SEGREDOS_CHAVES:-}
      DB_MAX_CONEXOES: ${API_DB_MAX_CONEXOES:-10}
      LOG_NIVEL: ${LOG_NIVEL:-info}
      JOBS_LIGADOS: ${JOBS_LIGADOS:-true}
      AGENDAMENTOS_LIGADOS: ${AGENDAMENTOS_LIGADOS:-false}
      # Opcionais: só entram se estiverem no .env (ausente ≠ vazio).
      JWT_CHAVES_ANTERIORES:
      SEGREDOS_CHAVE_ATUAL:
      REFRESH_DIAS:
      GOOGLE_CLIENT_ID:
      GOOGLE_CLIENT_SECRET:
      GOOGLE_REDIRECT_URI:
      LOGO_URL_BASE:
      METRICAS_TOKEN:
    volumes:
      # CA do Supabase para sslmode=verify-full.
      - ./certs:/etc/erp/certs:ro
    ports:
      - "${API_PORTA_HOST:-3001}:3000"
    networks: [default, erp-interna]
    depends_on:
      redis: { condition: service_healthy }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORTA_HOST:-8081}:80"
    networks: [default, erp-interna]
    depends_on: [api]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    # Só no localhost do host: o bun run dev da api usa redis://127.0.0.1:6379.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_dados:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  # Criada fora dos dois compose: api e web chegam ao worker-ssw por ela.
  erp-interna:
    external: true

volumes:
  redis_dados: {}
