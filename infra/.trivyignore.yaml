# Exceções do scan de imagem (Trivy) do CI e do release. Cada uma com motivo e validade: quando
# expira, o CI volta a falhar e alguém olha de novo. Nunca ignorar sem `expired_at`.
vulnerabilities:
  - id: CVE-2026-78661
    paths:
      - "usr/bin/caddy"
    statement: >-
      golang.org/x/net 0.60.0 embutido no binário oficial do Caddy 2.11.9 (imagem
      caddy:2.11-alpine@sha256:78bd3502..., a mesma das imagens erp-caddy e erp-web). Correção só
      no x/net 0.62.0, sem imagem oficial do Caddy com ela em 10/11/2026. Ao sair, atualizar
      CADDY_IMAGEM (caddy.Dockerfile e web.Dockerfile) e apagar esta exceção.
    expired_at: 2026-12-09
