# Publica as imagens no GHCR com a tag do commit (SHA curto). SÓ MANUAL (Actions → "Release" →
# Run workflow). Nada aqui faz deploy: na VPS, `./infra/deploy.sh <tag>` puxa a tag publicada
# (docs/deploy.md §6).
#
#   ghcr.io/<dono>/<repo>/erp-{api,web,migrador,caddy}:<sha7>
#
# Antes do push cada imagem passa pelo Trivy (HIGH/CRITICAL com correção = não publica). Saem
# com SBOM e proveniência (attestations do BuildKit). Nenhum segredo de produção vai para o
# GitHub: a configuração mora só no infra/.env da VPS.
name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag ou SHA a publicar"
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  TRIVY_VERSION: v0.76.2

jobs:
  publicar:
    name: Publicar ${{ matrix.imagem }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      # Uma imagem que falha não impede as outras de sair; o deploy usa a tag só se todas saíram.
      fail-fast: false
      matrix:
        include:
          - imagem: api
            contexto: .
          - imagem: web
            contexto: .
          - imagem: migrador
            contexto: .
          - imagem: caddy
            contexto: infra/docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Nome e tag
        id: meta
        env:
          IMAGEM: ${{ matrix.imagem }}
          REPO: ${{ github.repository }}
        run: |
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "imagem=ghcr.io/${REPO,,}/erp-$IMAGEM:$(git rev-parse --short=7 HEAD)"
            echo "criado=$(date -u +%FT%TZ)"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # 1) build local para o scan; 2) scan; 3) push (reaproveita o cache do passo 1).
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.contexto }}
          file: infra/docker/${{ matrix.imagem }}.Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.imagem }}
          build-args: |
            VERSAO=${{ steps.meta.outputs.sha }}
            COMMIT=${{ steps.meta.outputs.sha }}
            CRIADO_EM=${{ steps.meta.outputs.criado }}
          cache-from: type=gha,scope=release-${{ matrix.imagem }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.imagem }}

      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_IGNOREFILE: infra/.trivyignore.yaml
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: ${{ steps.meta.outputs.imagem }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.contexto }}
          file: infra/docker/${{ matrix.imagem }}.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.imagem }}
          build-args: |
            VERSAO=${{ steps.meta.outputs.sha }}
            COMMIT=${{ steps.meta.outputs.sha }}
            CRIADO_EM=${{ steps.meta.outputs.criado }}
          cache-from: type=gha,scope=release-${{ matrix.imagem }}

      - name: Resumo
        env:
          IMAGEM: ${{ steps.meta.outputs.imagem }}
        run: echo "Publicada \`$IMAGEM\`" >> "$GITHUB_STEP_SUMMARY"
