[install]
# Guarda de supply chain: não instala versão publicada há menos de 24 h.
# Exceção só com aprovação do dono do projeto.
minimumReleaseAge = 86400
# node_modules achatado: as ferramentas (vite, drizzle-kit, vitest) acham as dependências dos
# pacotes do workspace sem configuração extra.
linker = "hoisted"
